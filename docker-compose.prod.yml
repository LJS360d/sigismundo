# Production: prebuilt images, no source needed.
# Copy this file to the server next to a .env holding the server vars from
# server/.env.example (CLIENT_ID, CLIENT_SECRET, OWNER_IDS, SESSION_SECRET, ...),
# a ./games dir with your games and catalog.yaml, and `chown 1000:1000 data`
# before the first run. Only the activity is published; it proxies /api to the server.

name: sigismundo

services:
  activity:
    image: ghcr.io/ljs360d/sigismundo/activity:${SIGISMUNDO_VERSION:-latest}
    ports:
      - "${ACTIVITY_PORT:-80}:80"
    environment:
      API_URL: http://sigismundo:8080
    depends_on:
      - sigismundo
    restart: unless-stopped

  sigismundo:
    image: ghcr.io/ljs360d/sigismundo:${SIGISMUNDO_VERSION:-latest}
    env_file: .env
    # Beats empty keys in the env file, which would clobber the image ENV.
    environment:
      SERVER_ADDRESS: 0.0.0.0:8080
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./games:/games:ro
    # Optional, render and encode on the GPU (see GPU_* in server/.env.example).
    # RENDER_GID is the group owning the node: stat -c %g /dev/dri/renderD128
    # NVIDIA (proprietary driver) needs the NVIDIA Container Toolkit instead:
    # deploy.resources.reservations.devices with capabilities [gpu, video].
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID}"
    shm_size: 4g
    restart: unless-stopped
