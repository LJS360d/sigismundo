# Copy to <GAMES_DIR>/catalog.yaml and adjust. Entries whose exe is missing
# are skipped, so one manifest can list everything you might install.
# One entry = one exe; for a pack, the controller picks the game from the
# pack's own menu in the stream.
- id: jpp7                          # required, unique, no '/'
  name: The Jackbox Party Pack 7    # defaults to id
  # shown on the card
  description: |
    Quiplash 3
    The Devils and the Details
    Champ'd Up
    Talking Points
    Blather 'Round
  # required; relative to this file's directory, or absolute
  exe: jpp7/The Jackbox Party Pack 7.exe
  # args: []                        # extra args to the exe
  # image: jpp7/cover.png           # cover art, same path rules as exe

- id: drawful2
  name: Drawful 2
  exe: drawful2/Drawful 2.exe

# Smoke test without any game: Wine's own notepad (Debian/the image, then Arch).
- id: notepad
  name: Notepad (pipeline test)
  exe: /usr/lib/x86_64-linux-gnu/wine/x86_64-windows/notepad.exe
- id: notepad-arch
  name: Notepad (pipeline test)
  exe: /usr/lib/wine/x86_64-windows/notepad.exe
